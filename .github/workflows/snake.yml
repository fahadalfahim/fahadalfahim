name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (red snake, neon green dots)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF1744&color_dots=#ebedf0,#c8f7b8,#8ff06a,#4be31f,#1fb800
            dist/github-snake-dark.svg?color_snake=#FF1744&color_dots=#161b22,#0b3d1c,#0f7a2c,#1fd13a,#39FF14

      - name: Generate hacker header/footer, divider, trophy room and contribution graph
        continue-on-error: true
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, datetime

          USER = os.environ.get("GH_USER", "fahadalfahim")
          TOKEN = os.environ.get("GH_TOKEN", "")
          OUT = "dist"
          os.makedirs(OUT, exist_ok=True)

          # ---------- 1. fetch contribution data ----------
          def fetch_weeks():
              if os.environ.get("MOCK"):
                  import random
                  random.seed(4)
                  start = datetime.date.today() - datetime.timedelta(days=364)
                  weeks, d = [], start
                  for _ in range(53):
                      days = []
                      for _ in range(7):
                          days.append({"date": d.isoformat(), "contributionCount": max(0, int(random.gauss(2, 3)))})
                          d += datetime.timedelta(days=1)
                      weeks.append({"contributionDays": days})
                  return weeks
              q = """query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}"""
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=json.dumps({"query": q, "variables": {"login": USER}}).encode(),
                  headers={"Authorization": "bearer " + TOKEN, "Content-Type": "application/json", "User-Agent": "profile-readme"},
              )
              data = json.load(urllib.request.urlopen(req, timeout=30))
              return data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          def graph_svg(weeks):
              W, H = 900, 340
              L, R, T, B = 60, 870, 90, 270
              sums = [sum(d["contributionCount"] for d in w["contributionDays"]) for w in weeks]
              days = [d for w in weeks for d in w["contributionDays"]]
              total = sum(sums)
              best_day = max([d["contributionCount"] for d in days] or [0])
              active = sum(1 for d in days if d["contributionCount"] > 0)
              avg = total / max(len(weeks), 1)
              ymax = max(max(sums), 4)
              step = max(1, -(-ymax // 4))
              ymax = step * 4
              n = len(sums)
              xs = [L + (R - L) * i / max(n - 1, 1) for i in range(n)]
              ys = [B - (B - T) * v / ymax for v in sums]

              path = f"M{xs[0]:.1f},{ys[0]:.1f}"
              for i in range(1, n):
                  mx = (xs[i - 1] + xs[i]) / 2
                  path += f" C{mx:.1f},{ys[i-1]:.1f} {mx:.1f},{ys[i]:.1f} {xs[i]:.1f},{ys[i]:.1f}"
              area = path + f" L{xs[-1]:.1f},{B} L{xs[0]:.1f},{B} Z"

              grid = ""
              for k in range(5):
                  y = B - (B - T) * k / 4
                  grid += f'<line x1="{L}" y1="{y:.1f}" x2="{R}" y2="{y:.1f}" stroke="#30363D" stroke-width="1" stroke-dasharray="4 6"/>'
                  grid += f'<text x="{L-12}" y="{y+4:.1f}" text-anchor="end" class="ax">{step*k}</text>'

              months, last = "", None
              for i, w in enumerate(weeks):
                  dt = datetime.date.fromisoformat(w["contributionDays"][0]["date"])
                  if dt.month != last:
                      last = dt.month
                      if i < n - 2:
                          months += f'<text x="{xs[i]:.1f}" y="{B+22}" text-anchor="middle" class="ax">{dt.strftime("%b")}</text>'

              top = sorted(range(n), key=lambda i: sums[i], reverse=True)[:3]
              dots = ""
              for j, i in enumerate(sorted(set(top + [n - 1]))):
                  if sums[i] == 0:
                      continue
                  dots += (f'<circle cx="{xs[i]:.1f}" cy="{ys[i]:.1f}" r="4" fill="#fff"/>'
                           f'<circle cx="{xs[i]:.1f}" cy="{ys[i]:.1f}" r="4" fill="none" stroke="#39FF14" stroke-width="2" class="pulse" style="animation-delay:{j*0.5}s"/>')

              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="'Segoe UI',Ubuntu,Arial,sans-serif">
          <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#1A0A10"/></linearGradient>
          <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39FF14"/><stop offset="0.55" stop-color="#FFB300"/><stop offset="1" stop-color="#FF1744"/></linearGradient>
          <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF1744" stop-opacity="0.38"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
          </defs>
          <style>
          .t{{font-size:22px;font-weight:700;fill:#F0F6FC}}
          .s{{font-size:14px;fill:#39FF14;font-weight:600}}
          .ax{{font-size:12px;fill:#8B949E}}
          .f{{font-size:14px;fill:#C9D1D9;font-weight:600}}
          .draw{{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.5s ease-out .3s forwards}}
          .fade{{opacity:0;animation:fade 1.5s ease-out 2s forwards}}
          .pulse{{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}}
          @keyframes draw{{to{{stroke-dashoffset:0}}}}
          @keyframes fade{{to{{opacity:1}}}}
          @keyframes pulse{{0%{{transform:scale(1);opacity:.9}}100%{{transform:scale(3.2);opacity:0}}}}
          </style>
          <rect x="1" y="1" width="{W-2}" height="{H-2}" rx="18" fill="url(#bg)" stroke="#30363D"/>
          <text x="30" y="46" class="t">📈 Contribution Graph</text>
          <text x="{W-30}" y="46" text-anchor="end" class="s">{total} contributions in the last year</text>
          {grid}{months}
          <path d="{area}" fill="url(#ar)" class="fade"/>
          <path d="{path}" fill="none" stroke="url(#ln)" stroke-width="3.5" stroke-linecap="round" pathLength="1" class="draw"/>
          <g class="fade">{dots}</g>
          <text x="{W/2}" y="{H-24}" text-anchor="middle" class="f">🔥 Best day: {best_day}     📅 Active days: {active}     ⚡ Avg / week: {avg:.1f}</text>
          </svg>'''

          def trophy_svg():
              items = [
                  ("👑", "PRESIDENT", "@ PUCSC", "#FF1744"),
                  ("🛡️", "CYBER SEC", "Enthusiast", "#39FF14"),
                  ("🚩", "CTF", "Player", "#FF1744"),
                  ("🎓", "CSE", "Final Year", "#39FF14"),
                  ("🕷️", "WEB PENTEST", "Learning", "#FF1744"),
                  ("🐍", "PYTHON", "Scripting", "#39FF14"),
                  ("🐧", "LINUX", "Kali &amp; CLI", "#FF1744"),
              ]
              W, H, cw, gap = 900, 250, 112, 12
              x0 = (W - (len(items) * cw + (len(items) - 1) * gap)) / 2
              cards = ""
              for i, (ic, t, s, c) in enumerate(items):
                  x = x0 + i * (cw + gap)
                  cards += f'''<g class="fl" style="animation-delay:{i*0.35}s">
          <rect x="{x:.1f}" y="30" width="{cw}" height="180" rx="16" fill="#0D1117" stroke="{c}" stroke-width="2" class="glow" style="animation-delay:{i*0.35}s"/>
          <rect x="{x:.1f}" y="30" width="{cw}" height="180" rx="16" fill="url(#sh{i})"/>
          <circle cx="{x+cw/2:.1f}" cy="95" r="34" fill="{c}" fill-opacity="0.15" stroke="{c}" stroke-opacity="0.6"/>
          <text x="{x+cw/2:.1f}" y="108" text-anchor="middle" font-size="38">{ic}</text>
          <text x="{x+cw/2:.1f}" y="160" text-anchor="middle" class="h" fill="#F0F6FC">{t}</text>
          <text x="{x+cw/2:.1f}" y="182" text-anchor="middle" class="sub" fill="{c}">{s}</text>
          </g>'''
              defs = "".join(f'<linearGradient id="sh{i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{c}" stop-opacity="0.22"/><stop offset="0.6" stop-color="{c}" stop-opacity="0"/></linearGradient>' for i, (_, _, _, c) in enumerate(items))
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" font-family="'Segoe UI',Ubuntu,Arial,sans-serif">
          <defs>{defs}</defs>
          <style>
          .h{{font-size:13px;font-weight:800;letter-spacing:.5px}}
          .sub{{font-size:12px;font-weight:600}}
          .fl{{animation:fl 3s ease-in-out infinite alternate}}
          .glow{{animation:gl 3s ease-in-out infinite alternate}}
          @keyframes fl{{from{{transform:translateY(0)}}to{{transform:translateY(-9px)}}}}
          @keyframes gl{{from{{stroke-opacity:.35}}to{{stroke-opacity:1}}}}
          </style>
          {cards}
          </svg>'''

          try:
              weeks = fetch_weeks()
              open(f"{OUT}/contribution-graph.svg", "w", encoding="utf-8").write(graph_svg(weeks))
          except Exception as e:
              print("graph failed:", e)
          open(f"{OUT}/trophy-room.svg", "w", encoding="utf-8").write(trophy_svg())

          # ---------- 3. dark hacker header + footer + divider ----------
          import random

          MONO = "'Courier New',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace"
          GREEN, RED = "#39FF14", "#FF1744"
          CHARS = "0123456789ABCDEF$#%*+=/{}[]:;?!@"

          def _rain(rng, x0, x1, step, top, bottom, tail=15, red_every=6):
              """Falling matrix columns. Returns svg string."""
              out = []
              lh = 16
              col_h = tail * lh
              travel = (bottom - top) + col_h
              i = 0
              x = x0
              while x <= x1:
                  red = (i % red_every == 3)
                  base = RED if red else "#00FF41"
                  chars = [rng.choice(CHARS) for _ in range(tail)]
                  spans = []
                  for k, ch in enumerate(chars):
                      frac = (k + 1) / tail
                      if k == tail - 1:
                          fill, op = "#F2FFF2" if not red else "#FFE3E8", 1
                      else:
                          fill, op = base, 0.06 + 0.78 * frac * frac
                      spans.append(f'<tspan x="{x}" dy="{lh if k else 0}" fill="{fill}" fill-opacity="{op:.2f}">{ch}</tspan>')
                  dur = rng.uniform(4.5, 9.5)
                  dl = -rng.uniform(0, dur)
                  out.append(
                      f'<text x="{x}" y="{top - col_h}" class="rn" style="animation-duration:{dur:.1f}s;animation-delay:{dl:.1f}s;--d:{travel}px">'
                      + "".join(spans) + "</text>")
                  x += step
                  i += 1
              return "".join(out)

          HK_CSS = """
          .rn{font-family:%(m)s;font-size:14px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
          .mono{font-family:%(m)s;font-weight:700}
          .bl{animation:bl 1s steps(2,start) infinite}
          .scan{animation:scan 5s linear infinite}
          @keyframes fall{from{transform:translateY(0)}to{transform:translateY(var(--d))}}
          @keyframes bl{to{opacity:0}}
          @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(320px)}}
          @keyframes glitch{0%%,90%%,100%%{transform:translate(0,0);opacity:0}91%%{transform:translate(-5px,1px);opacity:.9}93%%{transform:translate(4px,-1px);opacity:.8}95%%{transform:translate(-2px,2px);opacity:.9}97%%{transform:translate(3px,0);opacity:.7}}
          @keyframes flick{0%%,94%%,100%%{opacity:1}95%%{opacity:.55}96%%{opacity:1}98%%{opacity:.7}}
          @keyframes borderpulse{from{stroke-opacity:.35}to{stroke-opacity:1}}
          """ % {"m": MONO}
          HK_CSS = HK_CSS.replace("%%", "%")

          def _dots():
              return (f'<circle cx="34" cy="29" r="6" fill="{RED}"/><circle cx="54" cy="29" r="6" fill="#FFB300"/><circle cx="74" cy="29" r="6" fill="{GREEN}"/>')

          def hacker_header_svg():
              W, H = 1000, 300
              rng = random.Random(42)
              rain = _rain(rng, 24, 976, 24, 44, 286)
              sub = "> President @ PUCSC | Cyber Security Enthusiast"
              sub_w = 640
              tags = (f'<tspan fill="{GREEN}">[ ETHICAL HACKER ]</tspan>  <tspan fill="{RED}">[ CTF PLAYER ]</tspan>  '
                      f'<tspan fill="{GREEN}">[ WEB PENTESTER ]</tspan>  <tspan fill="{RED}">[ PUCSC PRESIDENT ]</tspan>')
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>
          <clipPath id="body"><rect x="16" y="46" width="968" height="238"/></clipPath>
          <clipPath id="typ"><rect x="180" y="170" width="640" height="40"><animate attributeName="width" values="640;640;0;640;640" keyTimes="0;0.45;0.5;0.85;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
          <pattern id="scanp" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".28"/></pattern>
          <radialGradient id="dark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#040705" stop-opacity=".94"/><stop offset="0.65" stop-color="#040705" stop-opacity=".78"/><stop offset="1" stop-color="#040705" stop-opacity="0"/></radialGradient>
          <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
          <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{GREEN}" stop-opacity="0"/><stop offset="0.5" stop-color="{GREEN}" stop-opacity=".16"/><stop offset="1" stop-color="{GREEN}" stop-opacity="0"/></linearGradient>
          <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{RED}"/><stop offset="0.5" stop-color="{GREEN}"/><stop offset="1" stop-color="{RED}"/></linearGradient>
          <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <style>{HK_CSS}</style>
          <rect width="{W}" height="{H}" fill="#050806"/>
          <rect x="14" y="14" width="972" height="272" rx="12" fill="#070C09" stroke="url(#bd)" stroke-width="2" style="animation:borderpulse 3s ease-in-out infinite alternate"/>
          <rect x="14" y="14" width="972" height="32" rx="12" fill="#0E1A12"/><rect x="14" y="34" width="972" height="12" fill="#0E1A12"/>
          {_dots()}
          <text x="104" y="34" class="mono" font-size="13" fill="#7FB38C">root@fahad:~/pucsc# ./whoami --verbose</text>
          <text x="966" y="34" text-anchor="end" class="mono bl" font-size="13" fill="{GREEN}">● ACCESS GRANTED</text>
          <g clip-path="url(#body)">
          {rain}
          <ellipse cx="500" cy="165" rx="440" ry="125" fill="url(#dark)"/>
          <rect class="scan" x="16" y="46" width="968" height="60" fill="url(#bar)"/>
          </g>
          <text x="40" y="82" class="mono" font-size="14" fill="#5E8F6B">fahad@pucsc:~$ <tspan fill="{GREEN}">sudo</tspan> ./hack_the_planet.sh</text>
          <g style="animation:flick 7s linear infinite">
          <text x="180" y="148" class="mono" font-size="66" textLength="640" lengthAdjust="spacingAndGlyphs" fill="{RED}" style="animation:glitch 5s steps(1,end) infinite;opacity:0">FAHAD AL FAHIM</text>
          <text x="180" y="148" class="mono" font-size="66" textLength="640" lengthAdjust="spacingAndGlyphs" fill="{GREEN}" stroke="#020403" stroke-width="3" paint-order="stroke" filter="url(#glow)">FAHAD AL FAHIM</text>
          </g>
          <g clip-path="url(#typ)">
          <text x="180" y="196" class="mono" font-size="22" textLength="{sub_w}" lengthAdjust="spacing" fill="#E6FFEC">{sub}</text>
          </g>
          <rect class="bl" x="{180 + sub_w + 6}" y="178" width="12" height="22" fill="{GREEN}"/>
          <text x="500" y="256" text-anchor="middle" class="mono" font-size="15" textLength="760" lengthAdjust="spacing">{tags}</text>
          <rect x="16" y="46" width="968" height="238" fill="url(#scanp)"/>
          <rect x="16" y="46" width="968" height="238" fill="url(#vig)"/>
          <g fill="none" stroke="{GREEN}" stroke-width="2" class="bl" style="animation-duration:2s">
          <path d="M26 62 V54 H34"/><path d="M974 62 V54 H966"/><path d="M26 268 V276 H34"/><path d="M974 268 V276 H966"/></g>
          </svg>'''

          def hacker_footer_svg():
              W, H = 1000, 210
              rng = random.Random(77)
              rain = _rain(rng, 14, 986, 22, 0, 150, tail=12, red_every=5)
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <defs>
          <clipPath id="area"><rect x="0" y="0" width="{W}" height="{H}"/></clipPath>
          <pattern id="scanp" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".28"/></pattern>
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050806" stop-opacity="0"/><stop offset="0.55" stop-color="#050806" stop-opacity=".55"/><stop offset="1" stop-color="#050806" stop-opacity="1"/></linearGradient>
          <radialGradient id="dark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#040705" stop-opacity=".95"/><stop offset="0.7" stop-color="#040705" stop-opacity=".75"/><stop offset="1" stop-color="#040705" stop-opacity="0"/></radialGradient>
          <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{RED}" stop-opacity="0"/><stop offset="0.25" stop-color="{RED}"/><stop offset="0.75" stop-color="{GREEN}"/><stop offset="1" stop-color="{GREEN}" stop-opacity="0"/></linearGradient>
          <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <style>{HK_CSS}</style>
          <rect width="{W}" height="{H}" fill="#050806"/>
          <g clip-path="url(#area)">
          {rain}
          <rect x="0" y="0" width="{W}" height="{H}" fill="url(#fade)"/>
          <ellipse cx="500" cy="105" rx="420" ry="85" fill="url(#dark)"/>
          </g>
          <rect x="60" y="14" width="880" height="2.5" rx="1.2" fill="url(#bd)" class="bl" style="animation:borderpulse 2.5s ease-in-out infinite alternate"/>
          <g style="animation:flick 8s linear infinite">
          <text x="250" y="86" class="mono" font-size="38" textLength="500" lengthAdjust="spacingAndGlyphs" fill="{RED}" style="animation:glitch 6s steps(1,end) infinite;opacity:0">THANKS FOR VISITING</text>
          <text x="250" y="86" class="mono" font-size="38" textLength="500" lengthAdjust="spacingAndGlyphs" fill="{GREEN}" stroke="#020403" stroke-width="3" paint-order="stroke" filter="url(#glow)">THANKS FOR VISITING</text>
          </g>
          <text x="500" y="128" text-anchor="middle" class="mono" font-size="17" textLength="230" lengthAdjust="spacing" fill="#CFFFD8"><tspan fill="{RED}">fahad@pucsc</tspan>:<tspan fill="{GREEN}">~$</tspan> exit</text>
          <rect class="bl" x="{500 + 115 + 6}" y="113" width="11" height="19" fill="{GREEN}"/>
          <text x="500" y="168" text-anchor="middle" class="mono" font-size="14" textLength="480" lengthAdjust="spacing" fill="#6FA37C">STAY CURIOUS  •  HACK ETHICALLY  •  STAY SECURE</text>
          <rect x="0" y="0" width="{W}" height="{H}" fill="url(#scanp)"/>
          <rect x="0" y="{H-5}" width="{W}" height="5" fill="url(#bd)" opacity=".9"/>
          </svg>'''

          open(f"{OUT}/hacker-header.svg", "w", encoding="utf-8").write(hacker_header_svg())
          open(f"{OUT}/hacker-footer.svg", "w", encoding="utf-8").write(hacker_footer_svg())

          def divider_svg():
              return '''<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14">
          <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
          <stop offset="0" stop-color="#FF1744"/><stop offset="0.5" stop-color="#39FF14"/><stop offset="1" stop-color="#FF1744"/>
          <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0.5 0" dur="4s" repeatCount="indefinite"/>
          </linearGradient>
          <filter id="b" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
          </defs>
          <rect x="0" y="5" width="1000" height="4" rx="2" fill="url(#g)" opacity=".7" filter="url(#b)"/>
          <rect x="0" y="5.5" width="1000" height="3" rx="1.5" fill="url(#g)"/>
          </svg>'''

          open(f"{OUT}/divider.svg", "w", encoding="utf-8").write(divider_svg())
          print("done")
          PYEOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
